<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo.png">
<title>Iniciar sesión — CANAPROSUCRE</title>
<link rel="stylesheet" href="/assets/css/tailwind.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',system-ui,sans-serif;}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-brand-300 to-brand-600">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden border border-brand-700/20">
    <div class="bg-brand-600 text-white text-center py-8 px-6">
      <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-white border-4 border-accent-yellow overflow-hidden flex items-center justify-center">
        <img src="/assets/logo.png" alt="Logo CANAPROSUCRE" class="w-full h-full object-contain">
      </div>
      <h1 class="text-sm font-bold uppercase tracking-wide leading-snug">Casa Nacional del Profesor<br>CANAPROSUCRE</h1>
    </div>

    <form id="loginForm" class="p-6 space-y-4">
      <div id="errorMsg" class="hidden rounded-lg bg-red-600 text-white text-sm font-medium px-3 py-2"></div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-brand-900 mb-1">Usuario</label>
        <input type="text" id="username" autocomplete="username" required
          class="w-full rounded-lg border-2 border-brand-700 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-yellow">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-brand-900 mb-1">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required
          class="w-full rounded-lg border-2 border-brand-700 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-yellow">
      </div>

      <button type="submit"
        class="w-full bg-accent-blue hover:bg-[#1a3aa5] text-white font-extrabold uppercase tracking-wide text-sm rounded-lg py-3 transition-colors">
        Ingresar
      </button>

      <a href="/" class="block text-center text-xs font-semibold text-brand-700 hover:text-brand-900 pt-1">← Volver al inicio</a>
    </form>
  </div>

<script>
const form = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.classList.add("hidden");

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      errorMsg.textContent = data.error || "No se pudo iniciar sesión.";
      errorMsg.classList.remove("hidden");
      return;
    }

    // Ambos roles caen al buscador de asociados; desde ahí el admin puede ir a /admin
    window.location.href = "/consulta";
  } catch (err) {
    errorMsg.textContent = "Error de conexión con el servidor.";
    errorMsg.classList.remove("hidden");
  }
});
</script>
</body>
</html>
