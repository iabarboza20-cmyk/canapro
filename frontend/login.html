<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Canaprosucre</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 antialiased text-slate-800">

    <div class="max-w-md w-full">
        <!-- Logo y Cabecera -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block">
                <img src="assets/logo.png" alt="Canaprosucre Logo" class="h-16 w-auto mx-auto mb-4" onerror="this.src='https://via.placeholder.com/150x50?text=LOGO'">
            </a>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Acceso a la plataforma</h2>
            <p class="text-sm text-slate-500 mt-2">Ingrese sus credenciales para continuar</p>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 rounded-2xl border border-slate-100 sm:px-10">
            <form class="space-y-6" action="admin.html" method="POST">
                
                <!-- Campo Cédula / Usuario -->
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700">Documento de Identidad</label>
                    <div class="mt-2">
                        <input id="username" name="username" type="text" required 
                            class="block w-full appearance-none rounded-lg border border-slate-300 px-4 py-3 placeholder-slate-400 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 sm:text-sm transition duration-200" 
                            placeholder="Ej. 1234567890">
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
                    <div class="mt-2 relative">
                        <input id="password" name="password" type="password" required 
                            class="block w-full appearance-none rounded-lg border border-slate-300 px-4 py-3 placeholder-slate-400 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 sm:text-sm transition duration-200" 
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Opciones extra -->
                <div class="flex items-center justify-between mt-4">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" 
                            class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                        <label for="remember-me" class="ml-2 block text-sm text-slate-600">Recordarme</label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-emerald-700 hover:text-emerald-600">¿Olvidó su contraseña?</a>
                    </div>
                </div>

                <!-- Botón -->
                <div>
                    <button type="submit" 
                        class="flex w-full justify-center rounded-lg border border-transparent bg-emerald-700 py-3 px-4 text-sm font-bold text-white shadow-md hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 transition duration-200">
                        Iniciar Sesión
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-sm text-slate-500 mt-8">
            &copy; 2026 Canaprosucre. Soporte Técnico.
        </p>
    </div>

</body>
</html>
